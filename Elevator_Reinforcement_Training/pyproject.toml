[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elevator-training"
version = "1.0.0"
description = "RL training environment for intelevator PPO model"
authors = [
    {name = "Aaron Drake", email = "aaronjdrake@adapt-llc.com"}
]
requires-python = ">=3.11"
dependencies = [
    "stable-baselines3>=2.3.0",
    "sb3-contrib>=2.3.0",
    "gymnasium>=0.29.0",
    "pygame>=2.6.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "torch>=2.0.0",
]

[tool.setuptools.packages.find]
exclude = ["checkpoints_episode*", "ppo_elevator_tensorboard*"]
