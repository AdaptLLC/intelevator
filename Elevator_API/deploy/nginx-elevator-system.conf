# Nginx configuration for Elevator System Python Backend
# Place this in /etc/nginx/sites-available/elevator-system
# Then: sudo ln -s /etc/nginx/sites-available/elevator-system /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

upstream elevator_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name elevator.dell-cloudflare.local dell-cloudflare;

    # Increase buffer sizes for GraphQL
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Logging
    access_log /var/log/nginx/elevator-system-access.log;
    error_log /var/log/nginx/elevator-system-error.log;

    # GraphQL endpoint with WebSocket support for subscriptions
    location /graphql {
        proxy_pass http://elevator_backend;
        proxy_http_version 1.1;

        # WebSocket support for GraphQL subscriptions
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # Buffering
        proxy_buffering off;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://elevator_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        proxy_pass http://elevator_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        access_log off;  # Don't log health checks
    }

    # Static files (HTML frontend)
    location / {
        proxy_pass http://elevator_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

